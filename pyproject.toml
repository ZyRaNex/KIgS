[project]
name = "kigs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ZyRaNex", email = "eeggaall@googlemail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.159.1",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
    "zttp>=0.0.34",
]

[project.scripts]
kigs = "kigs:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
